<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PHIMS</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="field"></div>

<div class="app-shell" id="appShell">
  <nav class="nav-rail" id="navRail">
    <div class="nav-brand">
      <span class="mark">P</span>
      <span class="word">PHIMS</span>
    </div>
    <div id="navLinks"></div>
    <div class="nav-spacer"></div>
    <div class="nav-foot">
      <div class="nav-scope" id="navScope"></div>
      <button class="collapse-btn" id="collapseBtn" type="button">
        <span id="collapseIcon"></span>
        <span id="collapseLabel">Collapse</span>
      </button>
    </div>
  </nav>

  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn" id="mobileMenuBtn" type="button" aria-label="Open menu" style="display:none;">
        <span id="mobileMenuIcon"></span>
      </button>
      <span class="chip scope-chip" id="scopeChip"></span>
      <div class="search">
        <span id="searchIcon"></span>
        <input type="text" id="globalSearch" placeholder="Search facilities, cases, reports…" />
      </div>
      <div class="topbar-spacer"></div>
      <button class="theme-switch" id="themeSwitch" type="button" aria-label="Toggle dark mode">
        <span id="themeSwitchIconLeft" style="display:flex;"></span>
        <span class="track"><span class="thumb"></span></span>
        <span id="themeSwitchIconRight" style="display:flex;"></span>
      </button>
      <button class="icon-btn" id="logoutBtn" type="button" aria-label="Sign out">
        <span id="logoutIcon"></span>
      </button>
      <div class="user-menu">
        <span class="avatar" id="userAvatar"></span>
        <span>
          <div class="u-name" id="userName"></div>
          <div class="u-role" id="userRole"></div>
        </span>
      </div>
    </header>

    <main class="content" id="viewRoot"></main>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal glass" id="modalBody"></div>
</div>
<div class="toast-stack" id="toastStack"></div>

<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/charts.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
